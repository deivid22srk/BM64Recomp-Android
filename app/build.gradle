plugins {
    id 'com.android.application'
}

android {
    namespace 'com.deivid22srk.bm64recomp'
    compileSdk 34

    defaultConfig {
        applicationId 'com.deivid22srk.bm64recomp'
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName '1.0.0'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}
